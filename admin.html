    function App() {

              ...doc.data()

            // الترتيب حسب تاريخ الإنشاء: الأقدم أولاً (تصاعدياً)
            firestoreProjects.sort((a, b) => {
              const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt?.seconds ? a.createdAt.seconds * 1000 : 0);
              const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt?.seconds ? b.createdAt.seconds * 1000 : 0);
              return timeA - timeB;
            });
            setProjects(firestoreProjects.length > 0 ? firestoreProjects : INITIAL_PROJECTS);
            setFirestoreLoading(false);

        try {
          const api = `https://api.microlink.io/?url=${encodeURIComponent(formatted)}&screenshot=true`;
          const res = await fetch(api);
          if (res.ok) {
            const data = await res.json();
            if (data?.status === 'success' && data?.data?.screenshot?.url) {

        } catch (e) {}

                        <div key={p.id} className="portfolio-card">
                          <div className="portfolio-image-wrapper"><img src={p.image} className="portfolio-img" /><span className="sector-badge">{p.sector}</span></div>
                          <div className="portfolio-content">
                            <h4 style={{ color: 'white' }}>{p.title}</h4>
                            <p style={{ color: '#94A3B8', fontSize: '0.95rem' }}>{p.description}</p>
                            <div className="portfolio-result"><i className="fas fa-chart-line"></i><span>{p.result}</span></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              <div className="code-box-wrapper">
                <div className="code-box-header"><span><i className="fas fa-code"></i> كود HTML المولد للتصدير</span></div>
                <pre className="code-content">{generateServiceHTML(projects, 'all')}</pre>
              </div>
            </div>
          ) : (
            <main>
              <div className="service-bar">
                <div className="service-title-area">
                  <h2>{INITIAL_SERVICES.find(s => s.id === activeTab)?.name}</h2>
                  <p>{INITIAL_SERVICES.find(s => s.id === activeTab)?.description}</p>
                </div>
                <div className="filter-actions">
                  <div className="search-input-wrapper">
                    <i className="fas fa-search"></i>
                    <input type="text" className="search-input" placeholder="بحث..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                  </div>
                  <select className="select-filter" value={selectedSector} onChange={e => setSelectedSector(e.target.value)}>
                    <option value="all">جميع القطاعات</option>
                    {SECTORS_LIST.map(sec => <option key={sec} value={sec}>{sec}</option>)}
                  </select>
                  <button className="btn-primary" onClick={() => { setEditingProject(null); setIsModalOpen(true); }}>
                    <i className="fas fa-plus-circle"></i> إضافة مشروع جديد
                  </button>
                </div>
              </div>

              <div className="projects-grid">
                {currentProjects.map(proj => (
                  <div key={proj.id} className="portfolio-card">
                    <div className="portfolio-image-wrapper">
                      <img src={proj.image} alt={proj.title} className="portfolio-img" />
                      <span className="sector-badge"><i className="fas fa-tag"></i> {proj.sector}</span>
                    </div>
                    <div className="portfolio-content">
                      <h3 className="portfolio-title">{proj.title}</h3>
                      <p className="portfolio-desc">{proj.description}</p>
                      <div className="portfolio-result"><i className="fas fa-chart-line"></i><span>{proj.result}</span></div>
                      <div className="portfolio-card-actions">
                        <a href={proj.url} target="_blank" rel="nofollow noopener noreferrer" className="btn-visit">زيارة الموقع <i className="fas fa-arrow-left"></i></a>
                        <div style={{ display: 'flex', gap: '0.4rem' }}>
                          <button className="action-icon-btn" onClick={() => {
                            navigator.clipboard.writeText(generateServiceHTML([proj], proj.serviceId));
                            showToast(`تم نسخ كود بطاقة ${proj.title}`);
                          }}><i className="fas fa-code"></i></button>
                          <button className="action-icon-btn" onClick={() => { setEditingProject(proj); setIsModalOpen(true); }}><i className="fas fa-pen"></i></button>
                          <button className="action-icon-btn" style={{ color: '#FCA5A5' }} onClick={() => handleDeleteProject(proj.id)}><i className="fas fa-trash-alt"></i></button>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* Modal */}
          {isModalOpen && (
            <ProjectModal
              project={editingProject}
              serviceId={activeTab === 'publish' ? 'wordpress' : activeTab}
              onSave={handleSaveProject}
              onClose={() => setIsModalOpen(false)}
              onFetchScreenshot={handleFetchScreenshot}
            />
          )}

          {toast && <div className="toast-container"><div className="toast" style={toast.isError ? { borderColor: 'rgba(239, 68, 68, 0.5)' } : {}}><i className={toast.isError ? "fas fa-exclamation-circle" : "fas fa-check-circle"} style={{ color: toast.isError ? '#EF4444' : '#10B981' }}></i><span>{toast.msg}</span></div></div>}
        </div>
      );
    }

    function ProjectModal({ project, serviceId, onSave, onClose, onFetchScreenshot }) {
      const [form, setForm] = useState(project || {
        title: '', description: '', url: '', sector: SECTORS_LIST[0], result: '', image: '', serviceId
      });
      const [loading, setLoading] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({ ...form, id: project ? project.id : 'proj-' + Date.now() });
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3>{project ? 'تعديل مشروع' : 'إضافة مشروع جديد'}</h3>
              <button onClick={onClose} style={{ color: 'white', fontSize: '1.2rem' }}>✕</button>
            </div>
            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
              <div className="form-group">
                <label className="form-label">الخدمة</label>
                <select className="form-select" value={form.serviceId} onChange={e => setForm({...form, serviceId: e.target.value})}>
                  {INITIAL_SERVICES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">رابط الموقع (لسحب الصورة تلقائياً)</label>
                <div className="screenshot-fetch-row">
                  <input type="text" className="form-input" placeholder="https://..." value={form.url} onChange={e => setForm({...form, url: e.target.value})} />
                  <button type="button" className="btn-fetch-screenshot" onClick={async () => {
                    setLoading(true);
                    const imgUrl = await onFetchScreenshot(form.url);
                    if (imgUrl) setForm(prev => ({ ...prev, image: imgUrl }));
                    setLoading(false);
                  }}>{loading ? 'جاري السحب...' : 'سحب اللقطة تلقائياً'}</button>
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">صورة المعاينة / رفع صورة</label>
                <input type="text" className="form-input" placeholder="رابط الصورة المباشر" value={form.image} onChange={e => setForm({...form, image: e.target.value})} />
              </div>
              <div className="form-group">
                <label className="form-label">اسم المشروع</label>
                <input type="text" className="form-input" required value={form.title} onChange={e => setForm({...form, title: e.target.value})} />
              </div>
              <div className="form-group">
                <label className="form-label">القطاع</label>
                <select className="form-select" value={form.sector} onChange={e => setForm({...form, sector: e.target.value})}>
                  {SECTORS_LIST.map(sec => <option key={sec} value={sec}>{sec}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">النتيجة المحققة</label>
                <input type="text" className="form-input" required placeholder="مثال: +300% مبيعات" value={form.result} onChange={e => setForm({...form, result: e.target.value})} />
              </div>
              <div className="form-group">
                <label className="form-label">وصف قصير</label>
                <textarea className="form-textarea" rows={3} required value={form.description} onChange={e => setForm({...form, description: e.target.value})}></textarea>
              </div>
              <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.5rem', marginTop: '1rem' }}>
                <button type="button" className="btn-secondary" onClick={onClose}>إلغاء</button>
                <button type="submit" className="btn-primary">حفظ المشروع</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
